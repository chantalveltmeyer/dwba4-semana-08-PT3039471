    <script>

        // Entrada de dados
        let nome = prompt("Digite o nome do aluno:");

        let nota1 = parseFloat(prompt("Digite a nota 1:"));
        let nota2 = parseFloat(prompt("Digite a nota 2:"));

        // Cálculo da média
        let media = (nota1 + nota2) / 2;

        // Exibição do resultado
        alert(
            "Nome do aluno: " + nome +
            "\nNota final: " + media
        );

    </script>

<script src="script.js"></script>
